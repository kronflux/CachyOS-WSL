name: release
on:
  push:
    tags: ["20*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (YYYY.MM.DD.N)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign images (keyless)
        working-directory: dist
        run: |
          for f in cachyos-*-*.wsl; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Generate DistributionInfo.json
        run: ./scripts/gen-distribution-info.sh "${{ steps.tag.outputs.tag }}" dist > dist/DistributionInfo.json
      - name: Release body
        run: |
          {
            echo '### sha256'
            echo '```'
            cat dist/*.wsl.sha256
            echo '```'
            echo '### verify'
            echo '```'
            echo "cosign verify-blob <file>.wsl --bundle <file>.wsl.bundle \\"
            echo "  --certificate-identity-regexp 'https://github.com/kronflux/CachyOS-WSL/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > body.md
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          tag: ${{ steps.tag.outputs.tag }}
          bodyFile: body.md
          artifacts: "dist/*.wsl,dist/*.wsl.sha256,dist/*.wsl.bundle,dist/DistributionInfo.json"

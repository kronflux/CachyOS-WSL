name: release
on:
  push:
    tags: ["20*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (YYYY.MM.DD.N)"
        required: true

# Least privilege: the reusable build job runs read-only (enough to check out the
# repo); only the release job gets the write + id-token scopes to sign and publish.
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      image_version: ${{ github.event.inputs.tag || github.ref_name }}
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve tag
        id: tag
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Validate before use — the tag reaches shell steps below; a ref name
          # or dispatch input containing shell metacharacters must not execute.
          if [[ ! "$RAW_TAG" =~ ^20[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag '$RAW_TAG' (expected YYYY.MM.DD.N)"
            exit 1
          fi
          printf 'tag=%s\n' "$RAW_TAG" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Sign images (keyless)
        working-directory: dist
        run: |
          for f in cachyos-*-*.wsl; do
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
          done
      - name: Generate DistributionInfo.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/gen-distribution-info.sh "$TAG" dist > dist/DistributionInfo.json
      - name: Release body
        run: |
          {
            echo '### sha256'
            echo '```'
            cat dist/*.wsl.sha256
            echo '```'
            echo '### verify'
            echo '```'
            echo "cosign verify-blob <file>.wsl --bundle <file>.wsl.bundle \\"
            echo "  --certificate-identity-regexp 'https://github.com/kronflux/CachyOS-WSL/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > body.md
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          tag: ${{ steps.tag.outputs.tag }}
          bodyFile: body.md
          artifacts: "dist/*.wsl,dist/*.wsl.sha256,dist/*.wsl.bundle,dist/DistributionInfo.json,windows/register-distribution.ps1"

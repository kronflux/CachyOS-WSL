# Re-register WSL's Windows-interop binfmt handler.
#
# systemd-binfmt.service flushes ALL binfmt_misc entries at boot and re-registers
# only from /etc/binfmt.d/. That wipes the WSLInterop handler WSL installs itself,
# breaking `run Windows .exe from Linux` (e.g. powershell.exe during the OOBE, and
# general interop) until WSL happens to re-add it. Shipping the registration here
# makes systemd-binfmt restore it on every boot, so interop never drops.
#
# Format: :name:type:offset:magic:mask:interpreter:flags
#   M  = magic match, MZ = DOS/PE signature, /init = WSL interop handler,
#   PF = preserve argv[0] + fix-binary (open interpreter at registration).
:WSLInterop:M::MZ::/init:PF

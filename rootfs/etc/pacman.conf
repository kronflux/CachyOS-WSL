#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Files with no use in WSL, never installed or restored by upgrades: the
# Plymouth initramfs and reboot-required hooks (WSL has no initramfs or reboot)
# and the cachy-update tray applet.
NoExtract = usr/share/libalpm/hooks/cachyos-plymouth-initramfs.hook
NoExtract = usr/share/libalpm/hooks/cachyos-reboot-required.hook
NoExtract = etc/xdg/autostart/arch-update-tray.desktop

# CachyOS repositories, listed before the Arch Linux ones.
# First-run setup (/usr/lib/wsl/optimize-repos) adds the repositories optimized
# for the CPU (cachyos-v3, cachyos-v4 or cachyos-znver4) above [cachyos].
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Arch Linux repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist

# WSL starts user@<uid>.service from its login trigger before systemd's cgroup
# hierarchy has settled, losing an intermittent cgroup-spawn race that fails with
# "Failed to spawn executor: Device or resource busy" (Result: resources). This
# is upstream systemd#23164, exposed by WSL's early login trigger.
#
# Restart-on-failure lets the user manager start on a subsequent attempt. WSL
# still prints a cosmetic "Failed to start the systemd user session" line for its
# own failed first attempt.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=500ms

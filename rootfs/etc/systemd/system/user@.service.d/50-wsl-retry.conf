# WSL starts user@<uid>.service from its login trigger before systemd's cgroup
# hierarchy has settled, so it loses an intermittent cgroup-spawn race and fails
# with "Failed to spawn executor: Device or resource busy" (Result: resources).
# This is an upstream systemd race (systemd#23164) that WSL's early trigger hits
# reliably; a manual start always succeeds once the system has settled.
#
# Retry-on-failure lets the user manager win on the next attempt (~500ms later).
# Verified on WSL kernel 6.6 + systemd 261: NRestarts=1, then active with a
# working `systemctl --user` bus, consistently across reboots. (WSL still prints
# a cosmetic "Failed to start the systemd user session" line for its own failed
# first attempt; the session is up a moment later.)
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=500ms

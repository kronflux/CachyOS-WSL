# Overrides /usr/lib/systemd/system/user@.service.d/delegate.conf (same filename,
# /etc wins). Drops `cpuset` from the delegated controllers: cpuset has broken
# cgroup inheritance semantics that WSL's cgroup2 cannot delegate into the nested
# user cgroup, causing `user@<uid>.service` to fail with
# "Failed to spawn executor: Device or resource busy" (Result: resources).
[Service]
Delegate=cpu io memory pids
